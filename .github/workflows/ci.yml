name: CI

# Runs on every push to main and every pull request targeting main.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  checks:
    name: Lint · compile · test
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"   

      - name: Install lightweight dev tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt


      - name: Lint — real-bug subset only (syntax, undefined names, bad comparisons)
        run: ruff check --select E9,F63,F7,F82 src tests


      - name: Compile every script (syntax check, no execution)
        run: python -m compileall -q src

        
      - name: Run unit tests
        run: pytest -q
